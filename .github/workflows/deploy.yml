name: Deploy to S3

# Manual only for now: run it from the Actions tab ("Run workflow").
# To deploy on every push to main again, add:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

# One deploy at a time; a newer run cancels the one in progress
concurrency:
  group: deploy-prod
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  S3_BUCKET: threejs-dog

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the site (only what the page uses)
        run: |
          mkdir site
          cp -r index.html style.css src models sounds site/
          find site -type f | sort

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: |
          # Whole site, deleting files that no longer exist in the repo
          aws s3 sync site/ "s3://$S3_BUCKET/" --delete --cache-control "public, max-age=3600"
          # Correct content types for the model and the bark sound
          aws s3 cp site/models/ "s3://$S3_BUCKET/models/" --recursive --exclude "*" --include "*.glb" \
            --content-type model/gltf-binary --cache-control "public, max-age=3600"
          aws s3 cp site/sounds/ "s3://$S3_BUCKET/sounds/" --recursive --exclude "*" --include "*.mp3" \
            --content-type audio/mpeg --cache-control "public, max-age=3600"
          # Serve the page without cache so changes show up right away
          aws s3 cp site/index.html "s3://$S3_BUCKET/index.html" \
            --content-type "text/html; charset=utf-8" --cache-control "no-cache"

      - name: Invalidate CloudFront (if a distribution is configured)
        if: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
